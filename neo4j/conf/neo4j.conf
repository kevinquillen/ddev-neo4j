#ddev-generated
# Base Neo4j configuration shipped by kevinquillen/ddev-neo4j.
#
# Most settings are provided through NEO4J_* environment variables in
# docker-compose.neo4j.yaml. This file exists for tweaks that are
# cumbersome to express as env vars or that you want to version with
# the project. Lines below are conservative defaults safe for local
# dev; uncomment to enable.

# Accept Bolt + HTTP connections from any address inside the DDEV
# Docker network. Required so the web container can reach Neo4j.
server.default_listen_address=0.0.0.0

# Enable strict config validation so typos surface at boot rather
# than silently being ignored.
server.config.strict_validation.enabled=true

# Apoc + GDS procedures are whitelisted via env vars; uncomment to
# add additional allowlisted procedure namespaces here.
# dbms.security.procedures.unrestricted=apoc.*,gds.*,custom.*

# Connector listen addresses. The defaults are fine; included for
# discoverability.
# server.bolt.listen_address=:7687
# server.http.listen_address=:7474

# Disable usage telemetry posting back to Neo4j during local dev.
server.metrics.enabled=false
