#ddev-generated
# Neo4j service for DDEV, provided by kevinquillen/ddev-neo4j.
#
# Exposes the Neo4j Browser UI through the DDEV router at
# https://<project>.ddev.site:7475, Bolt to the web container at
# bolt://neo4j:7687, and Bolt to the host at bolt://<project>.ddev.site:7687
# (or bolt://localhost:7687). Data and logs are stored in named volumes
# so they survive `ddev stop` but are wiped by `ddev add-on remove neo4j`.
services:
  neo4j:
    container_name: ddev-${DDEV_SITENAME}-neo4j
    image: ${NEO4J_DOCKER_IMAGE:-neo4j:5-community}
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    expose:
      - "7474"
      - "7687"
    # Publish Bolt on the host loopback so the Neo4j Browser UI (which
    # runs in your actual browser, not the DDEV network) can reach it
    # at bolt://<project>.ddev.site:7687. The DDEV router only proxies
    # HTTP(S), so raw-TCP protocols like Bolt have to bind directly.
    # 127.0.0.1 binding keeps the port off the LAN. Override the host
    # port via DDEV_NEO4J_BOLT_HOST_PORT if 7687 collides with another
    # project or a local Neo4j install.
    ports:
      - "127.0.0.1:${DDEV_NEO4J_BOLT_HOST_PORT:-7687}:7687"
    # List-form environment matches the pattern used by ddev-solr /
    # ddev-adminer / ddev-phpmyadmin and is more tolerant of special
    # characters in values (brackets, quotes) than the mapping form.
    environment:
      - NEO4J_AUTH=neo4j/${DDEV_NEO4J_PASSWORD:-ddevpassword}
      # APOC and Graph Data Science are installed via NEO4J_PLUGINS.
      # The value is quoted because the JSON array contains YAML flow
      # indicators ([ ] , ") that some parsers reject in plain scalars.
      # To disable plugins, edit this line and set the value to '[]'.
      - 'NEO4J_PLUGINS=["apoc", "graph-data-science"]'
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=${DDEV_NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${DDEV_NEO4J_HEAP_MAX:-1G}
      - NEO4J_server_memory_pagecache_size=${DDEV_NEO4J_PAGECACHE:-512m}
      # Router integration: serve Neo4j Browser at
      # https://<project>.ddev.site:7475 (HTTPS via the DDEV router)
      # and http://<project>.ddev.site:7474. Matches the port-based
      # pattern used by ddev-phpmyadmin / ddev-solr / ddev-adminer.
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=7474:7474
      - HTTPS_EXPOSE=7475:7474
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    healthcheck:
      # HTTP probe on the Browser UI port. Bolt usually comes online
      # within a second of HTTP, and the bats suite waits on Bolt
      # explicitly before exercising queries, so a plain HTTP check
      # is robust enough for the depends_on gate. start_period is
      # generous because first boot downloads APOC + GDS into the
      # plugins volume, which can take 60+ seconds on a cold CI runner.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    # Wait for Neo4j's healthcheck before web is reported "running"
    # so `drush` / app code reaches a working Bolt endpoint right
    # after `ddev start`.
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins: